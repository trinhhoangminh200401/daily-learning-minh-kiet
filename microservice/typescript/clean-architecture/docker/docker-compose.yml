# ========================================
# DOCKER COMPOSE - DEVELOPMENT
# Run: docker-compose -f docker/docker-compose.yml up -d
# Docs: https://docs.docker.com/compose/
# ========================================

version: '3.8'

services:
  # ========================================
  # MONGODB - User Data Store
  # ========================================
  mongodb:
    image: mongo:7
    container_name: microservice_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-users_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservice_network

  # ========================================
  # POSTGRESQL - Product Data Store
  # ========================================
  postgres:
    image: postgres:16
    container_name: microservice_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-products_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservice_network

  # ========================================
  # REDIS - Cache & Session Store
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: microservice_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservice_network

  # ========================================
  # MONGO EXPRESS - MongoDB Admin UI (DEV ONLY)
  # Access: http://localhost:8081
  # ========================================
  mongo-express:
    image: mongo-express:latest
    container_name: microservice_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD:-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-password}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - microservice_network

  # ========================================
  # PGADMIN - PostgreSQL Admin UI (DEV ONLY)
  # Access: http://localhost:5050
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: microservice_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservice_network

  # ========================================
  # REDIS COMMANDER - Redis Admin UI (DEV ONLY)
  # Access: http://localhost:8082
  # ========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: microservice_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redispassword}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservice_network

# ========================================
# NETWORKS
# ========================================
networks:
  microservice_network:
    driver: bridge
    name: microservice_network

# ========================================
# VOLUMES - Persistent Data Storage
# ========================================
volumes:
  mongodb_data:
    name: microservice_mongodb_data
  mongodb_config:
    name: microservice_mongodb_config
  postgres_data:
    name: microservice_postgres_data
  redis_data:
    name: microservice_redis_data
  pgadmin_data:
    name: microservice_pgadmin_data
